name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks as CI — don't ship lint/test failures.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Error reporting (T4). All optional: with none set, the build has no
      # reporting and no source maps. The token is a secret and lives only in
      # this workflow (ci.yml runs on PRs and must never see it).
      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Source maps go to Sentry only. If one is left in dist, refuse to deploy.
      - name: Ensure no source maps are deployed
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "::error::Source maps found in dist — they must not be published."
            find dist -name '*.map'
            exit 1
          fi

      # Never ship a broken cut list: drive the real build before deploying it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:only

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
